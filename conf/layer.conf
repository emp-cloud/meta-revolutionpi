# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bsp_revpi"
BBFILE_PATTERN_meta-bsp_revpi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bsp_revpi = "9"

LAYERDEPENDS_meta-bsp_revpi = "core meta-raspberrypi"
LAYERSERIES_COMPAT_meta-bsp_revpi = "scarthgap"
