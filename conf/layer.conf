# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "revolutionpi"
BBFILE_PATTERN_revolutionpi = "^${LAYERDIR}/"
BBFILE_PRIORITY_revolutionpi = "9"

LAYERSERIES_COMPAT_revolutionpi = "wrynose"

LAYERDEPENDS_revolutionpi = "core raspberrypi"
