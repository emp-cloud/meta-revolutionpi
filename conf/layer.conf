# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "revpi"
BBFILE_PATTERN_revpi = "^${LAYERDIR}/"
BBFILE_PRIORITY_revpi = "9"

LAYERSERIES_COMPAT_revpi = "scarthgap"

LAYERDEPENDS_revpi = "core raspberrypi"
